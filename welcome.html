<html>
<head>
    <title>Página de Bem Vindo</title>
    <meta charset="utf-8" />
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1f2933;
        }
        main {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            padding: 40px 32px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(16, 42, 67, 0.08);
            text-align: center;
        }
        h1 {
            color: #102a43;
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 1.85rem;
        }
        p {
            margin: 16px 0 28px;
            color: #486581;
            line-height: 1.6;
            font-size: 1rem;
        }
        a {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 10px 24px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }
        a:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <main>
        <h1>Olá, visitante!</h1>
        <p>Seja bem vindo ao meu site. Se você chegou aqui é porque o login funcionou!</p>
        <a href="./index.html">VOLTAR</a>
    </main>
</body>
</html>
